name: drastha

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: drastha
      POSTGRES_USER: drastha
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - drastha-data:/var/lib/postgresql/data
      - ./deploy/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drastha"]
      interval: 3s
      timeout: 3s
      retries: 15
  analyst-console:
    build: .
    environment:
      DRASTHA_DB: postgresql://drastha:local-demo-only@database:5432/drastha
      DRASTHA_ROOT: /app
      DRASTHA_WEB: /app/web/dist
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  drastha-data:
