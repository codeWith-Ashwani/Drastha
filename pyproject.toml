[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisflow"
version = "0.1.0"
description = "Passive cyber-threat analytics for unidirectional networks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aegisflow = "aegisflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

