[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drastha"
version = "0.2.0"
description = "Passive cyber-threat analytics for unidirectional networks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
drastha = "aegisflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
