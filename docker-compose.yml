services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegisflow
      POSTGRES_USER: aegisflow
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - aegisflow-data:/var/lib/postgresql/data
      - ./deploy/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisflow"]
      interval: 3s
      timeout: 3s
      retries: 15
  analyst-console:
    build: .
    environment:
      AEGISFLOW_DB: postgresql://aegisflow:local-demo-only@database:5432/aegisflow
      AEGISFLOW_ROOT: /app
      AEGISFLOW_WEB: /app/web/dist
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  aegisflow-data:
